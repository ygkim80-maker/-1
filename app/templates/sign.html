{% extends "base.html" %}
{% block title %}전자서명 - {{ document.title }}{% endblock %}
{% block content %}
<h1>배송 안전교육 서명</h1>
<p class="notice">아래 교육 내용을 확인하고, 소속과 이름을 입력한 뒤 서명해 주세요.</p>

<section class="card-block">
  <h2>{{ document.title }}</h2>
  <pre class="document-box">{{ document.content }}</pre>

  <label>소속 지사
    <select id="site_id">
      <option value="">선택해 주세요</option>
      {% for site in sites %}
      <option value="{{ site.id }}">{{ site.name }}</option>
      {% endfor %}
    </select>
  </label>

  <label>이름
    <input type="text" id="name" placeholder="이름을 입력해 주세요">
  </label>

  <label class="agree-label">
    <input type="checkbox" id="agree">
    위 교육 내용을 확인하였으며, 교육을 완료했습니다.
  </label>

  <h3>서명</h3>
  <canvas id="signature-pad" width="400" height="200"></canvas>
  <div class="canvas-actions">
    <button type="button" id="clear-btn">지우기</button>
  </div>

  <button id="submit-btn" type="button">서명 제출</button>
  <p id="submit-error" class="error"></p>
</section>

<script>
// 서명 패드: 외부 라이브러리 없이 canvas로 직접 구현
const canvas = document.getElementById("signature-pad");
const ctx = canvas.getContext("2d");
ctx.lineWidth = 2.5;
ctx.lineCap = "round";
ctx.strokeStyle = "#111827";
let drawing = false;
let hasDrawn = false;

function pointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  const point = e.touches ? e.touches[0] : e;
  return {
    x: (point.clientX - rect.left) * (canvas.width / rect.width),
    y: (point.clientY - rect.top) * (canvas.height / rect.height),
  };
}

function start(e) {
  drawing = true;
  hasDrawn = true;
  const p = pointerPos(e);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  e.preventDefault();
}

function move(e) {
  if (!drawing) return;
  const p = pointerPos(e);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  e.preventDefault();
}

function end() {
  drawing = false;
}

canvas.addEventListener("mousedown", start);
canvas.addEventListener("mousemove", move);
window.addEventListener("mouseup", end);
canvas.addEventListener("touchstart", start, { passive: false });
canvas.addEventListener("touchmove", move, { passive: false });
canvas.addEventListener("touchend", end);

document.getElementById("clear-btn").addEventListener("click", () => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  hasDrawn = false;
});

document.getElementById("submit-btn").addEventListener("click", async () => {
  const submitError = document.getElementById("submit-error");
  submitError.textContent = "";

  const siteId = document.getElementById("site_id").value;
  const name = document.getElementById("name").value.trim();
  if (!siteId) {
    submitError.textContent = "소속 지사를 선택해 주세요.";
    return;
  }
  if (!name) {
    submitError.textContent = "이름을 입력해 주세요.";
    return;
  }
  if (!document.getElementById("agree").checked) {
    submitError.textContent = "동의 체크박스를 선택해 주세요.";
    return;
  }
  if (!hasDrawn) {
    submitError.textContent = "서명을 입력해 주세요.";
    return;
  }

  const signature_image = canvas.toDataURL("image/png");
  const body = new URLSearchParams({ name, site_id: siteId, agree: "on", signature_image });
  const res = await fetch(`/sign/submit`, { method: "POST", body });
  const data = await res.json();
  if (!res.ok) {
    submitError.textContent = data.detail || "제출에 실패했습니다.";
    return;
  }
  window.location.href = data.redirect;
});
</script>
{% endblock %}
